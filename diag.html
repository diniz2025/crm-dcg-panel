<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Diag CRM</title></head>
<body style="font-family:monospace;background:#0d1117;color:#0f0;padding:20px;font-size:13px;white-space:pre-wrap">
<div id="out">rodando…</div>
<script>
const o = (m) => { document.getElementById('out').textContent += '\n' + m; };
document.getElementById('out').textContent = 'teste iniciado';
(async () => {
  const API = 'https://mxathygvqidwhdpdvsbu.supabase.co/functions/v1/crm';
  try {
    o('1. preflight OPTIONS…');
    const r1 = await fetch(API, {method:'OPTIONS', headers:{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type','Origin':location.origin}});
    o('   status: ' + r1.status + ' | acao: ' + r1.headers.get('access-control-allow-origin'));
  } catch(e){ o('   FALHOU: ' + e.message); }
  try {
    o('2. POST login…');
    const r2 = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'login', email:'diniz@dcgseguros.com.br', password:'Dcg-2026!Diniz'})});
    o('   status: ' + r2.status + ' | acao: ' + r2.headers.get('access-control-allow-origin'));
    const j = await r2.json();
    o('   ok: ' + j.ok + ' | error: ' + (j.error||'nenhum'));
    if(j.ok) o('   TOKEN: ' + (j.token||'').slice(0,30) + '…');
  } catch(e){ o('   FALHOU: ' + e.message); }
  try { localStorage.setItem('t','1'); o('3. localStorage OK'); } catch(e){ o('3. localStorage FALHOU: ' + e.message); }
})();
</script>
</body></html>
